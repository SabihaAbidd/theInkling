services:
  postgres:
    image: postgres:16
    container_name: ai-news-aggregator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_news}
      POSTGRES_USER: ${POSTGRES_USER:-ai_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_news_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_news} -d ${POSTGRES_DB:-ai_news}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: the-inkling-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: the-inkling-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ai_news}:${POSTGRES_PASSWORD:-ai_news_password}@postgres:5432/${POSTGRES_DB:-ai_news}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    command: pipenv run uvicorn app.web:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: the-inkling-worker
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ai_news}:${POSTGRES_PASSWORD:-ai_news_password}@postgres:5432/${POSTGRES_DB:-ai_news}
      REDIS_URL: redis://redis:6379/0
    command: pipenv run celery -A app.worker.celery_app worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: the-inkling-web
    working_dir: /workspace
    restart: unless-stopped
    volumes:
      - ..:/workspace
      - frontend_node_modules:/workspace/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
