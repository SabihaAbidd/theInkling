[project]
name = "the-inkling"
version = "0.1.0"
description = "A personalized morning newspaper powered by a LangGraph editorial workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.44",
    "psycopg2-binary>=2.9.11",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.2",
    "feedparser>=6.0.12",
    "markdownify>=0.11.6",
    "youtube-transcript-api>=1.2.3",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "stripe>=12.0.0",
    "python-dotenv>=1.2.1",
    "schedule>=1.2.0",
    "markdown>=3.7.0",
    "langchain>=1.0.0",
    "langchain-groq>=1.0.0",
    "langgraph>=1.0.0",
    "langsmith>=0.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "fastapi-limiter>=0.1.6",
    "reportlab>=4.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
