services:
  - type: web
    name: the-inkling-api
    runtime: python
    plan: free
    buildCommand: pip install pipenv==2026.10.0 && pipenv sync --system
    startCommand: alembic upgrade head && python -m app.render_start
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: the-inkling
  - type: worker
    name: the-inkling-worker
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install pipenv==2026.10.0 && pipenv sync --system
    startCommand: celery -A app.worker.celery_app worker --loglevel=INFO
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: the-inkling
